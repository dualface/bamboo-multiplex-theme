# Bamboo Multiplex (id: bamboo-multiplex), ported from the QuickTUI client
# terminal theme (quicktui-mono protocol/client/data-terminal-themes.yml;
# upstream ribru17/bamboo.nvim extras/ghostty/bamboo_multiplex, MIT).
# herdr has no named user themes: install.sh sets theme.name = "one-dark" and these tokens override it.
# Remove this table to get plain one-dark back.
[theme.custom]
accent = "#81af58"         # green (cursor #fff8f0 is near-white, too flat as accent)
panel_bg = "#232923"       # background
sidebar_bg = "#232923"     # background
active_row_bg = "#3f443f"  # derived: midpoint of background and selectionBackground
selection_bg = "#5a5e5a"   # selectionBackground
surface0 = "#3f443f"       # derived, same midpoint
surface1 = "#5a5e5a"       # selectionBackground
surface_dim = "#353b35"    # derived: background shifted 1/3 toward selectionBackground
overlay0 = "#a3a08d"       # derived: midpoint of brightBlack and foreground (brightBlack alone is unreadable on background)
overlay1 = "#c8c0a7"       # derived: brightBlack shifted 3/4 toward foreground
text = "#ece1c0"           # foreground
subtext0 = "#c8c0a7"       # derived, same as overlay1
mauve = "#a09af8"          # magenta
green = "#81af58"
yellow = "#ceba49"
red = "#dc4f62"
blue = "#409cdc"
teal = "#68baae"           # cyan
peach = "#ceba49"          # brightYellow
